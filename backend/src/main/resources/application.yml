server:
  port: ${PORT:8080}

spring:
  application:
    name: internal-employee-portal
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:employee_portal}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
